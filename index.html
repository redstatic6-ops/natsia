<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3eee5">
  <title>Читающий навигатор — найди свою книгу</title>

  <style>
    :root {
      --paper: #f3eee5;
      --surface: #ebe4d8;
      --ink: #292723;
      --muted: #696359;
      --line: #bdb5a7;
      --accent: #a44932;
      --green: #425c49;
      --serif: Georgia, "Times New Roman", serif;
      --sans: Arial, Helvetica, sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.55 var(--sans);
    }

    button, input, select, textarea { font: inherit; }
    button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:disabled, select:disabled { opacity: .55; cursor: wait; }
    a { color: inherit; }
    button, a { touch-action: manipulation; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { overflow-wrap: anywhere; }
    h1 {
      font: 400 clamp(36px, 5vw, 64px)/1.05 var(--serif);
      letter-spacing: -.04em;
      margin-bottom: 22px;
    }
    h2 { font: 400 30px/1.15 var(--serif); }
    h3 { font: 400 24px/1.15 var(--serif); }

    .wrap {
      max-width: 1280px;
      margin: auto;
      padding: 24px clamp(18px, 4vw, 54px);
    }

    .skip {
      position: absolute;
      left: 12px;
      top: -100px;
      padding: 10px;
      background: var(--paper);
      z-index: 20;
    }
    .skip:focus { top: 10px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: 20px 30px;
      align-items: center;
      padding: 12px 0 20px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      gap: 11px;
      align-items: center;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 11px;
      line-height: 1.1;
      letter-spacing: .07em;
      font-weight: 700;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid var(--ink);
      font: 13px var(--serif);
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 20px;
    }
    nav a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      font-size: 13px;
      text-decoration: none;
      color: var(--muted);
      border-bottom: 1px solid transparent;
    }
    nav a:hover, nav a[aria-current="page"] {
      color: var(--ink);
      border-color: var(--accent);
    }

    .search-form {
      display: flex;
      gap: 8px;
      flex: 1 1 210px;
      max-width: 340px;
      margin-left: auto;
      border-bottom: 1px solid var(--line);
    }
    .search-form input {
      width: 100%;
      min-width: 0;
      border: 0;
      background: transparent;
      padding: 10px 0;
      color: var(--ink);
    }
    .search-form button {
      border: 0;
      background: transparent;
      padding: 10px 0 10px 10px;
      color: var(--accent);
    }

    main { min-height: 65vh; }
    main:focus { outline: none; }

    .notice {
      padding: 13px 16px;
      margin: 18px 0 0;
      border-left: 3px solid var(--green);
      background: #e1e6df;
      overflow-wrap: anywhere;
    }
    .notice.error {
      border-color: var(--accent);
      background: #eee0d8;
    }

    .intro {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 36px;
      padding: 60px 0 42px;
      border-bottom: 1px solid var(--line);
    }
    .intro h1 em { color: var(--accent); }
    .lead {
      max-width: 540px;
      color: var(--muted);
      margin-bottom: 0;
    }
    .eyebrow {
      margin-bottom: 16px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .12em;
    }
    .intro-note {
      padding-left: 24px;
      border-left: 1px solid var(--line);
      font-family: var(--serif);
    }
    .intro-note p { margin-top: 34px; font-size: 21px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }

    .section { padding: 30px 0; border-bottom: 1px solid var(--line); }
    .section-heading {
      display: flex;
      gap: 12px 24px;
      flex-wrap: wrap;
      align-items: baseline;
      margin-bottom: 20px;
    }
    .section-heading h2 {
      margin: 0;
      font: 700 12px var(--sans);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .section-heading p { margin: 0; font-size: 13px; color: var(--muted); }

    .topic-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .topic {
      display: flex;
      flex-direction: column;
      min-height: 200px;
      padding: 18px;
      border: 1px solid var(--line);
      background: #ebe4d8;
      text-decoration: none;
      transition: border-color .15s;
    }
    .topic:hover { border-color: var(--accent); }
    .topic:nth-child(2) { background: #e1e6df; }
    .topic:nth-child(3) { background: #e6ded4; }
    .topic:nth-child(4) { background: #dfe7e8; }
    .topic:last-child { grid-column: span 2; background: #e9dfcf; }
    .topic-top {
      display: flex;
      justify-content: space-between;
      color: var(--accent);
      font-size: 13px;
      margin-bottom: 30px;
    }
    .topic h3 { margin: auto 0 10px; }
    .topic p { font-size: 13px; color: var(--muted); margin-bottom: 0; }

    .recommendation {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 32px;
      align-items: center;
      max-width: 820px;
    }
    .recommendation h3 { font-size: 34px; margin-bottom: 14px; }

    .page-title { padding: 38px 0 24px; border-bottom: 1px solid var(--line); }
    .page-title .back { display: inline-block; margin-bottom: 22px; }
    .page-title p { max-width: 750px; color: var(--muted); margin-bottom: 0; }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }
    .book-card {
      display: flex;
      flex-direction: column;
      padding: 18px;
      border: 1px solid var(--line);
      min-width: 0;
    }
    .book-open { text-decoration: none; }
    .book-open:hover h2 { color: var(--accent); }
    .book-card h2 { margin: 18px 0 8px; font-size: 27px; }
    .author { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
    .genre { color: var(--accent); font-size: 12px; margin-bottom: 12px; }
    .description { color: var(--muted); font-size: 14px; }
    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: auto;
      padding-top: 10px;
    }

    .cover {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      min-height: 260px;
      overflow: hidden;
      padding: 22px;
      background: var(--book-color, #a94e36);
      color: #fff7ed;
    }
    .cover-top, .cover-bottom { font-size: 12px; }
    .cover-title { font: 400 32px/1.08 var(--serif); overflow-wrap: anywhere; }
    .cover-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: var(--paper);
    }
    .recommendation .cover { min-height: 210px; padding: 16px; }
    .recommendation .cover-title { font-size: 25px; }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 9px 16px;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      line-height: 1.4;
    }
    .button:hover { background: #e4dbcd; }
    .button.primary, .button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .button.primary:hover, .button.active:hover { background: #8e3e2b; }
    .button.danger { color: var(--accent); border-color: var(--accent); }

    .text-link, .back {
      color: var(--accent);
      text-decoration-thickness: 1px;
      text-underline-offset: 5px;
      font-size: 14px;
    }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }

    .detail-top {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 42px;
      align-items: start;
    }
    .detail-top .cover { min-height: 350px; }
    .detail-top h1 { font-size: clamp(34px, 4vw, 52px); }
    .detail-top .controls { max-width: 380px; margin-top: 24px; }
    .reading-text { max-width: 800px; }
    .reading-text section { padding: 26px 0; border-bottom: 1px solid var(--line); }
    .reading-text h2 { font-size: 26px; color: var(--accent); }
    .reading-text p { margin-bottom: 0; }

    .empty { padding: 45px 0; max-width: 650px; }
    .empty h2 { font-size: 30px; }
    .empty p { color: var(--muted); }

    .form-panel { max-width: 520px; margin: 30px 0; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
    .form-grid .field { margin-bottom: 0; }
    .field label { font-size: 14px; }
    .field input, .field select, .field textarea {
      width: 100%;
      min-width: 0;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: #faf6ef;
      color: var(--ink);
      font-size: 16px;
    }
    .field textarea { resize: vertical; min-height: 110px; }
    .full { grid-column: 1 / -1; }

    .tabs { display: flex; flex-wrap: wrap; gap: 10px; margin: 24px 0; }
    .tabs a {
      padding: 9px 13px;
      border: 1px solid var(--line);
      font-size: 14px;
      text-decoration: none;
    }
    .tabs a.active { color: var(--accent); border-color: var(--accent); }

    .account-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr);
      gap: 40px;
    }
    .account-grid > div { min-width: 0; }
    .account-section { padding: 28px 0; border-bottom: 1px solid var(--line); }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--line);
      margin-top: 24px;
      padding-bottom: 22px;
      gap: 16px;
    }
    .stat strong { display: block; font: 36px var(--serif); }
    .stat span { color: var(--muted); font-size: 13px; }

    progress { width: 100%; height: 10px; accent-color: var(--green); }
    .week {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
      list-style: none;
      padding: 0;
      margin: 18px 0;
    }
    .week li { border: 1px solid var(--line); padding: 10px 4px; text-align: center; }
    .week li.done { background: #dce5d9; border-color: #7d9277; }
    .week small { display: block; font-size: 11px; color: var(--muted); }
    .week strong { display: block; font-size: 13px; margin-top: 5px; }

    .diary-entry { padding: 20px 0; border-top: 1px solid var(--line); }
    .diary-entry h3 { font-size: 23px; margin-bottom: 8px; }
    .diary-entry p { margin-bottom: 10px; }
    .diary-note { white-space: pre-wrap; overflow-wrap: anywhere; }

    footer {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 24px 0 8px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    @media (max-width: 950px) {
      .topbar { gap: 12px 24px; }
      .search-form { order: 3; max-width: none; flex-basis: 100%; }
      nav { margin-left: auto; }
      .topic-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .books-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .account-grid { grid-template-columns: 1fr; gap: 0; }
    }

    @media (max-width: 600px) {
      .wrap { padding-top: 12px; }
      .topbar { gap: 12px; }
      nav { flex-basis: 100%; margin-left: 0; gap: 4px 18px; }
      .intro { grid-template-columns: 1fr; padding: 36px 0; }
      .intro-note { display: none; }
      .topic-grid, .books-grid { grid-template-columns: 1fr; }
      .topic:last-child { grid-column: auto; }
      .topic { min-height: 160px; }
      .recommendation { grid-template-columns: 1fr; gap: 24px; }
      .recommendation .cover { max-width: 170px; }
      .detail-top { grid-template-columns: 1fr; gap: 28px; }
      .detail-top .cover { max-width: 230px; }
      .form-grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .week { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .section-heading { align-items: start; }
      .stat strong { font-size: 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

<body>
  <a class="skip" href="#view">Перейти к содержанию</a>

  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Читающий навигатор — главная">
        <span class="brand-mark" aria-hidden="true">ЧН</span>
        <span>Читающий<br>навигатор</span>
      </a>

      <nav aria-label="Основная навигация">
        <a href="#/" data-nav="/">Главная</a>
        <a href="#/shelf" data-nav="/shelf">Моя полка</a>
        <a href="#/favorites" data-nav="/favorites" id="favorites-link">Избранное</a>
        <a href="#/account" data-nav="/account" id="account-link">Войти</a>
      </nav>

      <form class="search-form" id="search-form" role="search">
        <label class="sr-only" for="search-input">Название книги или автор</label>
        <input
          id="search-input"
          type="search"
          placeholder="Название или автор"
          maxlength="200"
          autocomplete="off"
        >
        <button type="submit">Найти</button>
      </form>
    </header>

    <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>

    <main id="view" tabindex="-1">
      <div class="empty"><p>Загружаем каталог…</p></div>
    </main>

    <footer>
      <span>Читающий навигатор</span>
      <span>Выбери свою историю · 7 класс</span>
    </footer>
  </div>

  

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
(() => {
  "use strict";

  const SUPABASE_URL = "https://bkhfdsquqforlptamrbo.supabase.co";
  const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJraGZkc3F1cWZvcmxwdGFtcmJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2NTI0ODYsImV4cCI6MjEwODIyODQ4Nn0.ruJ6Smsdw7cajdSs8l-4gaT0crWRQQ6I9CiGkyEhay4";

  const view = document.getElementById("view");
  const notice = document.getElementById("notice");

  const topics = [
    ["adventures", "Хочется приключений", "Путешествия, риск и поиски сокровищ"],
    ["mystery", "Хочется разгадать тайну", "Загадки, улики и расследования"],
    ["fantasy", "Хочется попасть в необычный мир", "Магия, фантастика и необычные герои"],
    ["peers", "Хочется понять сверстников", "Дружба, выбор и взросление"],
    ["classics", "Хочется прочитать что-то необычное из классики", "Юмор, необычные события и яркие характеры"]
  ];

  const statuses = {
    none: "Не на полке",
    want: "Хочу прочитать",
    reading: "Читаю",
    done: "Прочитано"
  };

  const state = {
    service: "loading",
    serviceError: "",
    catalog: "loading",
    catalogError: "",
    books: [],
    authReady: false,
    user: null,
    personal: "idle",
    personalError: "",
    profile: null,
    library: new Map(),
    diary: [],
    editDate: "",
    recovery:
      new URLSearchParams(location.hash.slice(1)).get("type") === "recovery"
  };

  let db = null;
  let busy = false;
  let authVersion = 0;
  let personalVersion = 0;
  let catalogVersion = 0;

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function notify(text, error = false) {
    notice.textContent = text;
    notice.className = "notice" + (error ? " error" : "");
    notice.setAttribute("role", error ? "alert" : "status");
    notice.hidden = false;
    if (error) notice.scrollIntoView({ block: "nearest" });
  }

  function explain(error) {
    const text = error?.message || String(error || "Неизвестная ошибка");

    if (["42P01", "PGRST205"].includes(error?.code)) {
      return "Таблицы nav_* не найдены. Выполните SQL из предыдущей инструкции в SQL Editor вашего проекта Supabase.";
    }
    if (/invalid login credentials/i.test(text)) {
      return "Неверный адрес электронной почты или пароль.";
    }
    if (/email not confirmed/i.test(text)) {
      return "Сначала подтвердите адрес электронной почты по ссылке из письма.";
    }
    if (/rate limit|too many requests/i.test(text)) {
      return "Слишком много запросов. Подождите и попробуйте снова.";
    }
    if (/invalid api key|invalid jwt|jwt expired/i.test(text)) {
      return "Supabase отклонил ключ доступа. Проверьте URL проекта и его публичный anon-ключ.";
    }
    if (/failed to fetch|network|abort/i.test(text)) {
      return "Нет ответа от Supabase. Проверьте интернет и доступность проекта. Если ошибка появилась при сохранении, обновите данные перед повторной попыткой.";
    }
    return text;
  }

  function deadline(promise, ms = 20000) {
    let timer;
    return Promise.race([
      Promise.resolve(promise),
      new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error(
          "Сервер не ответил за 20 секунд. Проверьте подключение и обновите страницу. Последнее изменение могло сохраниться."
        )), ms);
      })
    ]).finally(() => clearTimeout(timer));
  }

  async function timedFetch(input, options = {}) {
    const controller = new AbortController();
    const originalSignal =
      options.signal || (input instanceof Request ? input.signal : null);
    const abort = () => controller.abort();

    if (originalSignal?.aborted) abort();
    else originalSignal?.addEventListener("abort", abort, { once: true });

    const timer = setTimeout(abort, 15000);

    try {
      return await fetch(input, { ...options, signal: controller.signal });
    } finally {
      clearTimeout(timer);
      originalSignal?.removeEventListener("abort", abort);
    }
  }

  async function checked(query) {
    const result = await deadline(Promise.resolve(query));
    if (result.error) throw result.error;
    return result.data;
  }

  function dateISO(date = new Date()) {
    return [
      date.getFullYear(),
      String(date.getMonth() + 1).padStart(2, "0"),
      String(date.getDate()).padStart(2, "0")
    ].join("-");
  }

  function plusDays(iso, count) {
    const [year, month, day] = iso.split("-").map(Number);
    return dateISO(new Date(year, month - 1, day + count, 12));
  }

  function dateLabel(iso) {
    return new Date(iso + "T12:00:00").toLocaleDateString("ru-RU", {
      day: "numeric",
      month: "short",
      year: "numeric"
    });
  }

  function route() {
    const full = location.hash.startsWith("#/")
      ? location.hash.slice(1)
      : "/";
    const index = full.indexOf("?");
    return {
      full,
      path: index < 0 ? full : full.slice(0, index),
      params: new URLSearchParams(index < 0 ? "" : full.slice(index + 1))
    };
  }

  function go(path) {
    if (location.hash === "#" + path) render();
    else location.hash = path;
  }

  function siteURL() {
    if (!["http:", "https:"].includes(location.protocol)) {
      throw new Error(
        "Для регистрации и восстановления пароля откройте опубликованный сайт по HTTPS, а не файл file://."
      );
    }
    const url = new URL(location.href);
    url.hash = "";
    url.search = "";
    return url.href;
  }

  function bookById(id) {
    return state.books.find(book => book.id === id);
  }

  function entry(id) {
    return state.library.get(id) || {
      book_id: id,
      favorite: false,
      status: "none"
    };
  }

  function bookHref(book) {
    return "#/book/" + encodeURIComponent(book.id) +
      "?from=" + encodeURIComponent(route().full);
  }

  function backHref(book) {

      from === "/favorites" ||
      from === "/account" ||
      /^\/topic\/[a-z0-9-]+$/.test(from) ||
      /^\/shelf(?:\?|$)/.test(from) ||
      /^\/search(?:\?|$)/.test(from);

    return "#" + (allowed ? from : "/topic/" + book.category);

      if (book.cover_url) {
        const url = new URL(book.cover_url);
        if (url.protocol === "https:") {
          image = `<img class="cover-image" src="${esc(url.href)}"
            alt="" loading="lazy" decoding="async"
            referrerpolicy="no-referrer">`;
        }
      }
    } catch (_) {}

    return `<div class="cover" style="--book-color:${color}"
      role="img" aria-label="${esc("Обложка: " + book.title)}">
      <span class="cover-top">${esc(book.genre)}</span>
      <span class="cover-title">${esc(book.title)}</span>
      <span class="cover-bottom">${esc(book.author)}</span>

  }

  function experiment() {
    const start = state.profile.experiment_start;
    if (!start) {
      return `<h2>7 дней с книгой</h2>

    }

    const days = Array.from({ length: 7 }, (_, index) => {
      const date = plusDays(start, index);
      return { date, minutes: state.diary.find(row => row.read_on === date)?.minutes || 0 };
    });
    const completed = days.filter(day => day.minutes >= 20).length;

    return `<h2>7 дней с книгой</h2>
      <p class="small">${esc(dateLabel(start))} — ${esc(dateLabel(plusDays(start, 6)))}</p>
      <progress max="7" value="${completed}" aria-label="Дни с чтением от 20 минут"></progress>
      <p>Отмечено ${completed} из 7 дней с чтением от 20 минут.</p>
      <ol class="week">
        ${days.map((day, index) => `
          <li class="${day.minutes >= 20 ? "done" : ""}">
            <small>День ${index + 1}</small>

    document.getElementById("favorites-link").textContent =
      "Избранное" + (state.user && count ? " · " + count : "");

    document.querySelectorAll("[data-nav]").forEach(link => {
      if (link.dataset.nav === path) link.setAttribute("aria-current", "page");
      else link.removeAttribute("aria-current");

  function render() {
    const current = route();
    let content = "";

    if (current.path === "/") {
      content = home();
    } else if (current.path.startsWith("/topic/")) {
      const id = current.path.slice("/topic/".length);
      const topic = topics.find(item => item[0] === id);
      content = topic
        ? title(topic[1], topic[2]) + `<section class="section">${
            catalogGate() || grid(state.books.filter(book => book.category === id))
          }</section>`
        : problem("Раздел не найден", "Перейдите на главную и выберите направление.");
    } else if (current.path.startsWith("/book/")) {
      let id = "";
      try { id = decodeURIComponent(current.path.slice("/book/".length)); } catch (_) {}
      const book = bookById(id);
      content = catalogGate() ||
        (book ? bookPage(book) : problem("Книга не найдена", "Вернитесь к каталогу."));
    } else if (current.path === "/search") {
      const query = (current.params.get("q") || "").trim().slice(0, 200);
      const normalize = value => String(value).toLocaleLowerCase("ru").replace(/ё/g, "е");
      const words = normalize(query).split(/\s+/).filter(Boolean);
      const found = state.books.filter(book => {
        const text = normalize(book.title + " " + book.author);
        return words.every(word => text.includes(word));
      });
      content = title("Поиск", query ? `Запрос: «${query}»` : "Все книги") +
        `<section class="section">${catalogGate() || grid(found)}</section>`;
      document.getElementById("search-input").value = query;
    } else if (["/favorites", "/shelf"].includes(current.path)) {
      const favorites = current.path === "/favorites";
      const filter = current.params.get("status") || "all";
      const books = state.books.filter(book => {
        const item = entry(book.id);
        return favorites
          ? item.favorite
          : item.status !== "none" && (filter === "all" || item.status === filter);
      });

      const tabs = favorites ? "" : `<div class="tabs">${
        [["all", "Все"], ...Object.entries(statuses).filter(([key]) => key !== "none")]
          .map(([key, label]) => `<a href="#/shelf?status=${key}"
            class="${key === filter ? "active" : ""}">${esc(label)}</a>`).join("")
      }</div>`;

      content = title(favorites ? "Избранное" : "Моя полка",
        "Сохранённые книги доступны после входа на любом устройстве.") +
        (personalGate() || `<section class="section">
          <div class="actions">${button("load-personal", "Обновить данные")}</div>
          ${tabs}
          ${catalogGate() || grid(books,
            "Откройте карточку книги и добавьте её в избранное или выберите статус чтения.")}
        </section>`);
    } else if (current.path === "/account") {
      content = accountPage();
    } else {
      content = problem("Страница не найдена", "Воспользуйтесь меню вверху.");
    }

    view.innerHTML = content;
    updateHeader();
  }

  async function readAll(table, orderColumn, userId = null) {
    const result = [];
    for (let offset = 0; ; offset += 500) {
      let query = db.from(table).select("*")
        .order(orderColumn, { ascending: orderColumn !== "read_on" })
        .range(offset, offset + 499);

      if (table === "nav_books") query = query.order("id");
      if (userId) query = query.eq("user_id", userId);

      const rows = await checked(query);
      result.push(...rows);
      if (rows.length < 500) return result;
    }
  }

  async function loadBooks() {
    if (!db) return;
    const version = ++catalogVersion;
    state.catalog = "loading";
    state.catalogError = "";
    render();

    try {
      const books = await readAll("nav_books", "sort_order");
      if (version !== catalogVersion) return;
      state.books = books;
      state.catalog = "ready";
    } catch (error) {
      if (version !== catalogVersion) return;
      state.catalog = "error";
      state.catalogError = explain(error);
    }
    render();
  }

  async function loadPersonal() {
    if (!db || !state.user) return;
    const user = state.user;
    const version = ++personalVersion;
    state.personal = "loading";
    state.personalError = "";
    render();

    try {
      const [profile, library, diary] = await Promise.all([
        checked(db.from("nav_profiles").select("*").eq("user_id", user.id).maybeSingle()),
        readAll("nav_library", "book_id", user.id),
        readAll("nav_diary", "read_on", user.id)
      ]);

      if (version !== personalVersion || state.user?.id !== user.id) return;

      state.profile = profile || {
        user_id: user.id,
        nickname: String(user.user_metadata?.nickname || "Читатель").trim().slice(0, 40) || "Читатель",
        experiment_start: null
      };
      state.library = new Map(library.map(row => [row.book_id, row]));
      state.diary = diary;
      state.personal = "ready";
    } catch (error) {
      if (version !== personalVersion || state.user?.id !== user.id) return;
      state.personal = "error";
      state.personalError = explain(error);
    }
    render();
  }

  function acceptSession(session) {
    const next = session?.user || null;
    const changed = (state.user?.id || null) !== (next?.id || null);
    const first = !state.authReady;

    state.user = next;
    state.authReady = true;

    if (changed) {
      personalVersion++;
      state.profile = null;
      state.library = new Map();
      state.diary = [];
      state.editDate = "";
      state.personal = "idle";
      state.personalError = "";
    }

    if (changed || first) render();
    else updateHeader();

    if (next && state.personal === "idle") void loadPersonal();
  }

  function requireUser() {
    if (!db) throw new Error("Подключение к Supabase ещё не готово.");
    if (!state.user) {
      go("/account");
      throw new Error("Сначала войдите в аккаунт.");
    }
    if (state.personal !== "ready") {
      throw new Error("Личные данные ещё не загружены. Откройте аккаунт и нажмите «Обновить данные».");
    }
    return state.user.id;
  }

  function sameUser(userId) {
    if (state.user?.id !== userId) {
      throw new Error("Аккаунт изменился во время запроса. Обновите данные.");
    }
  }

  async function saveLibrary(bookId, patch) {
    const userId = requireUser();
    if (!bookById(bookId)) throw new Error("Книга не найдена.");

    // Сначала создаём строку, если её ещё нет. Существующую не перезаписываем.
    await checked(db.from("nav_library").upsert({
      user_id: userId,
      book_id: bookId
    }, {
      onConflict: "user_id,book_id",
      ignoreDuplicates: true
    }));

    const saved = await checked(db.from("nav_library")
      .update(patch)
      .eq("user_id", userId)
      .eq("book_id", bookId)
      .select()
      .single());

    sameUser(userId);
    state.library.set(bookId, saved);
    render();
  }

  async function saveProfile(patch) {
    const userId = requireUser();

    await checked(db.from("nav_profiles").upsert({
      user_id: userId,
      nickname: state.profile.nickname,
      experiment_start: state.profile.experiment_start
    }, {
      onConflict: "user_id",
      ignoreDuplicates: true
    }));

    const saved = await checked(db.from("nav_profiles")
      .update(patch)
      .eq("user_id", userId)
      .select()
      .single());

    sameUser(userId);
    state.profile = saved;
    render();
  }

  async function task(element, action) {
    if (busy) return;
    busy = true;
    const wasDisabled = element?.disabled || false;
    if (element) element.disabled = true;
    notice.hidden = true;

    try {
      await action();
    } catch (error) {
      notify(explain(error), true);
    } finally {
      busy = false;
      if (element?.isConnected) element.disabled = wasDisabled;
    }
  }

  async function submitAuth(formData) {
    const mode = formData.get("mode");
    const email = String(formData.get("email") || "").trim();
    const password = String(formData.get("password") || "");

    if (mode === "reset") {
      const result = await deadline(db.auth.resetPasswordForEmail(email, {
        redirectTo: siteURL()
      }));
      if (result.error) throw result.error;
      notify("Если адрес зарегистрирован, на него придёт письмо для восстановления пароля.");
      return;
    }

    let result;
    if (mode === "register") {
      const nickname = String(formData.get("nickname") || "").trim();
      if (!nickname || nickname.length > 40) {
        throw new Error("Введите имя или псевдоним длиной до 40 символов.");
      }
      if (password.length < 8) throw new Error("Пароль должен содержать минимум 8 символов.");

      result = await deadline(db.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: siteURL(),
          data: { nickname }
        }
      }));
    } else {
      result = await deadline(db.auth.signInWithPassword({ email, password }));
    }

    if (result.error) throw result.error;
    if (result.data.session) {
      acceptSession(result.data.session);
      go("/account");
      notify("Вы вошли в аккаунт.");
    } else {
      go("/account");
      notify("Регистрация выполнена. Проверьте почту и подтвердите адрес.");
    }
  }

  async function submitPassword(formData) {
    const password = String(formData.get("password") || "");
    const repeat = String(formData.get("repeat") || "");

    if (password.length < 8) {
      throw new Error("Пароль должен содержать минимум 8 символов.");
    }

    if (password !== repeat) {
      throw new Error("Пароли не совпадают.");
    }

    const result = await deadline(
      db.auth.updateUser({ password })
    );

    if (result.error) throw result.error;

    state.recovery = false;
    go("/account");
    notify("Пароль успешно изменён.");
  }

  async function saveDiary(formData) {
    const userId = requireUser();

    const readOn = String(formData.get("read_on") || "");
    const bookId = String(formData.get("book_id") || "");
    const minutes = Number(formData.get("minutes"));
    const pages = Number(formData.get("pages"));
    const interest = Number(formData.get("interest"));
    const wantsContinue =
      String(formData.get("wants_continue")) === "yes";
    const note = String(formData.get("note") || "").trim();

    if (!/^\d{4}-\d{2}-\d{2}$/.test(readOn)) {
      throw new Error("Укажите корректную дату.");
    }

    if (readOn > dateISO()) {
      throw new Error("Нельзя добавить запись на будущую дату.");
    }

    if (!bookById(bookId)) {
      throw new Error("Выберите книгу.");
    }

    if (!Number.isInteger(minutes) || minutes < 1 || minutes > 1440) {
      throw new Error("Время чтения должно быть от 1 до 1440 минут.");
    }

    if (!Number.isInteger(pages) || pages < 0 || pages > 2000) {
      throw new Error("Количество страниц указано неверно.");
    }

    if (!Number.isInteger(interest) || interest < 1 || interest > 5) {
      throw new Error("Оценка интереса должна быть от 1 до 5.");
    }

    if (note.length > 1000) {
      throw new Error("Впечатление должно быть не длиннее 1000 символов.");
    }

    const row = {
      user_id: userId,
      read_on: readOn,
      book_id: bookId,
      minutes,
      pages,
      interest,
      wants_continue: wantsContinue,
      note
    };

    const saved = await checked(
      db
        .from("nav_diary")
        .upsert(row, { onConflict: "user_id,read_on" })
        .select()
        .single()
    );

    sameUser(userId);

    state.diary = [
      saved,
      ...state.diary.filter(item => item.read_on !== readOn)
    ].sort((a, b) => b.read_on.localeCompare(a.read_on));

    state.editDate = "";
    render();
    notify("Запись дневника сохранена.");
  }

  async function deleteDiary(date) {
    const userId = requireUser();

    await checked(
      db
        .from("nav_diary")
        .delete()
        .eq("user_id", userId)
        .eq("read_on", date)
    );

    sameUser(userId);

    state.diary = state.diary.filter(row => row.read_on !== date);

    if (state.editDate === date) {
      state.editDate = "";
    }

    render();
    notify("Запись удалена.");
  }

  document.addEventListener("click", event => {
    const target = event.target instanceof Element
      ? event.target.closest("[data-action]")
      : null;

    if (!target) return;

    const action = target.dataset.action;

    if (action === "reload") {
      location.reload();
      return;
    }

    if (action === "load-books") {
      void loadBooks();
      return;
    }

    if (action === "load-personal") {
      if (!state.user) {
        go("/account");
        return;
      }

      void loadPersonal();
      return;
    }

    if (action === "favorite") {
      event.preventDefault();

      if (!state.user) {
        go("/account");
        notify("Войдите в аккаунт, чтобы сохранять книги.");
        return;
      }

      void task(target, async () => {
        const bookId = target.dataset.book;
        const current = entry(bookId);

        await saveLibrary(bookId, {
          favorite: !current.favorite
        });

        notify(
          current.favorite
            ? "Книга удалена из избранного."
            : "Книга добавлена в избранное."
        );
      });

      return;
    }

    if (action === "logout") {
      void task(target, async () => {
        const result = await deadline(db.auth.signOut());

        if (result.error) throw result.error;

        state.recovery = false;
        acceptSession(null);
        go("/");
        notify("Вы вышли из аккаунта.");
      });

      return;
    }

    if (action === "start-week") {
      void task(target, async () => {
        await saveProfile({
          experiment_start: dateISO()
        });

        notify("Новая читательская неделя началась.");
      });

      return;
    }

    if (action === "cancel-edit") {
      state.editDate = "";
      render();
      return;
    }

    if (action === "edit-diary") {
      state.editDate = target.dataset.date || "";
      render();

      setTimeout(() => {
        document
          .getElementById("diary-form")
          ?.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 0);

      return;
    }

    if (action === "delete-diary") {
      const date = target.dataset.date;

      if (!date || !confirm("Удалить эту запись дневника?")) {
        return;
      }

      void task(target, () => deleteDiary(date));
    }
  });

  document.addEventListener("submit", event => {
    const form = event.target;

    if (!(form instanceof HTMLFormElement)) return;

    event.preventDefault();

    if (form.id === "search-form") {
      const input = form.querySelector("input");
      const query = String(input?.value || "").trim();

      go(query
        ? "/search?q=" + encodeURIComponent(query)
        : "/search"
      );

      return;
    }

    const submitter =
      event.submitter ||
      form.querySelector('button[type="submit"]');

    const formData = new FormData(form);

    if (form.id === "auth-form") {
      void task(submitter, () => submitAuth(formData));
      return;
    }

    if (form.id === "password-form") {
      void task(submitter, () => submitPassword(formData));
      return;
    }

    if (form.id === "shelf-form") {
      void task(submitter, async () => {
        const bookId = String(formData.get("book_id") || "");
        const status = String(formData.get("status") || "");

        if (!Object.prototype.hasOwnProperty.call(statuses, status)) {
          throw new Error("Выберите корректный статус.");
        }

        await saveLibrary(bookId, { status });
        notify("Статус книги сохранён.");
      });

      return;
    }

    if (form.id === "profile-form") {
      void task(submitter, async () => {
        const nickname = String(formData.get("nickname") || "").trim();

        if (!nickname || nickname.length > 40) {
          throw new Error("Имя должно содержать от 1 до 40 символов.");
        }

        await saveProfile({ nickname });
        notify("Имя сохранено.");
      });

      return;
    }

    if (form.id === "diary-form") {
      void task(submitter, () => saveDiary(formData));
    }
  });

  window.addEventListener("hashchange", () => {
    render();
  });

  async function init() {
    render();

    if (
      !window.supabase ||
      typeof window.supabase.createClient !== "function"
    ) {
      state.service = "error";
      state.serviceError =
        "Не загрузилась библиотека Supabase. Проверьте наличие строки CDN перед этим скриптом.";
      render();
      return;
    }

    try {
      db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          },
          global: {
            fetch: timedFetch
          }
        }
      );

      state.service = "ready";
      render();

      db.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY") {
          state.recovery = true;
          acceptSession(session);

          if (route().path !== "/account") {
            go("/account");
          }

          return;
        }

        if (event === "SIGNED_OUT") {
          state.recovery = false;
        }

        acceptSession(session);
      });

      const sessionResult = await deadline(
        db.auth.getSession()
      );

      if (sessionResult.error) {
        throw sessionResult.error;
      }

      acceptSession(sessionResult.data.session);

      if (state.recovery) {
        go("/account");
      }

      await loadBooks();
    } catch (error) {
      state.service = "error";
      state.serviceError = explain(error);
      render();
    }
  }

  void init();
})();
</script>
</body>
</html>
